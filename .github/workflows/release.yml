name: release

on:
    workflow_dispatch:
    push:
        tags: ["v*"]

permissions:
    contents: read

jobs:
    build:
        runs-on: ubuntu-26.04-arm
        timeout-minutes: 90
        env:
            LLVM_CONFIG: llvm-config-21
            CXX: clang++-21
        steps:
            - uses: actions/checkout@v7
              with:
                  persist-credentials: false

            - name: Check release tag
              if: github.ref_type == 'tag'
              run: test "$GITHUB_REF_NAME" = "v$(jq -r .version app/appinfo.json)"

            - uses: oven-sh/setup-bun@v2

            - name: Install build tools
              run: |
                  sudo apt-get update
                  sudo apt-get install -y --no-install-recommends clang-21 llvm-21-dev ccache meson libexpat1-dev trash-cli just
                  bun install --frozen-lockfile

            - name: Cache toolchain
              id: toolchain
              uses: actions/cache@v6
              with:
                  path: .cache/toolchain
                  key: ubuntu-26.04-arm-llvm21-${{ hashFiles('scripts/toolchain.sources', 'scripts/setup-*.sh', 'scripts/env.sh', 'scripts/platform/**', 'patches/*.patch') }}

            - name: Build toolchain
              if: steps.toolchain.outputs.cache-hit != 'true'
              run: just setup

            - name: Build app package
              run: just build-package

            - uses: actions/upload-artifact@v7
              with:
                  name: leantube-arm32
                  path: |
                      build/release/
                      build/app/appinfo.json
                  if-no-files-found: error

    release:
        name: release
        if: github.event_name == 'push' && github.ref_type == 'tag'
        needs: build
        runs-on: ubuntu-slim
        concurrency:
            group: release-${{ github.ref }}
            cancel-in-progress: false
        permissions:
            contents: write
        env:
            GH_TOKEN: ${{ github.token }}
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
                  persist-credentials: false

            - uses: oven-sh/setup-bun@v2

            - uses: actions/download-artifact@v8
              with:
                  name: leantube-arm32
                  path: build

            - uses: hyperpuncher/release-notes@v1
              id: notes

            - name: Publish release
              env:
                  NOTES_PATH: ${{ steps.notes.outputs.path }}
              run: |
                  tag="$GITHUB_REF_NAME"
                  if [[ "$(gh release view "$tag" --json isDraft --jq '.isDraft' 2>/dev/null)" == false ]]; then
                    printf 'Release %s is already published.\n' "$tag"
                    exit 0
                  fi

                  version="${tag#v}"
                  directory="build/release/$version"
                  id="$(jq -er '.id' app/appinfo.json)"
                  ipk="$directory/${id}_${version}_arm.ipk"
                  digest="$(sha256sum "$ipk" | cut -d' ' -f1)"
                  size="$(stat -c %s "$ipk")"
                  jq -n --arg name "${ipk##*/}" --arg digest "sha256:$digest" --argjson size "$size" \
                    '{assets: [{$name, $digest, $size}]}' | bun scripts/release.ts

                  gh release create "$tag" "$ipk" "$directory/repo.json" \
                    --verify-tag --latest --title "$tag" --notes-file "$NOTES_PATH"
